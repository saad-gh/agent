[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-agent"
version = "0.1.0"
description = "Workflow Agent — agentic workflow builder and manager built on workflow-orchestrator."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "Django>=4.2",
    "redis>=5.0",
    "django-rq>=2.10",
    "aiohttp>=3.9",
    "Jinja2>=3.1",
    "PyJWT>=2.8",
    "requests>=2.31",
    "psycopg2-binary>=2.9",
    "httpx>=0.25",
    "pgvector>=0.2.0",
    "workflow-orchestrator @ git+https://github.com/saad-gh/workflow.git",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
]
search = [
    "tavily-python>=0.3.0",
]
test = [
    "fakeredis[aioredis]>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
